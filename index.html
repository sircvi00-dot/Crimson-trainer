<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crimson Powerforce Trainer</title>
<meta name="theme-color" content="#f3f1ed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#2a0a10; --deep:#1d0710; --ember:#c8323a; --flame:#f0623a;
  --gold:#a8741f; --steel:#5f7088; --bone:#231a1d; --mute:#6a5e57;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --ui:"Barlow Semi Condensed", "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html{background:#f3f1ed}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--ui); color:var(--bone); font-size:16px; line-height:1.45;
  background:
    linear-gradient(180deg, #f7f6f3 0%, #efede8 100%);
  background-attachment:fixed;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  -webkit-tap-highlight-color:transparent;
}
button{font-family:var(--ui);font-size:15px;color:var(--bone);background:#fff;
  border:1px solid rgba(226,178,90,.5);border-radius:6px;padding:9px 14px;cursor:pointer;min-height:42px}
button:hover{border-color:var(--gold);background:rgba(226,178,90,.12)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--ember);border-color:var(--ember);color:#fff;font-weight:600}
.app{max-width:1100px;margin:0 auto;padding:10px 10px 18px;display:grid;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:.04em;color:var(--gold);white-space:nowrap}
@media (max-width:420px){h1{font-size:16px}.tabs button{padding:6px 9px}}
.tabs{display:flex;gap:4px}
.tabs button{padding:6px 12px;min-height:36px;font-size:14px}
.tabs button.on{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:600}
.lp{display:flex;justify-content:space-between;font-family:var(--display);font-size:14px;color:var(--mute);padding:0 4px}
.lp b{color:var(--bone);font-size:17px;margin-left:6px}
.stage{position:relative;width:100%;margin:0 auto;touch-action:manipulation}
.board{position:absolute;left:0;top:0;width:100%;border-radius:10px;overflow:hidden;
  background:
    linear-gradient(180deg, #e3e5e9 0%, #dddbd8 50%, #e6dedb 100%);
  border:1px solid rgba(0,0,0,.14);box-shadow:inset 0 0 18px rgba(0,0,0,.06)}
.sigil{position:absolute;border-radius:50%;border:1px solid rgba(0,0,0,.1);pointer-events:none}
.sigil.two{border-style:dashed;border-color:rgba(200,50,58,.15)}
.midline{position:absolute;left:4%;right:4%;height:1px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.18),transparent)}
.zone{position:absolute;border:1px solid rgba(0,0,0,.16);background:rgba(255,255,255,.55);border-radius:4px;
  box-shadow:none}
.zone.opp{border-color:rgba(95,112,136,.3);background:rgba(240,244,250,.6)}
.zone.emz{border-radius:50%/12%;border-color:rgba(200,50,58,.45)}
.zone .lab{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;color:rgba(0,0,0,.4);letter-spacing:.02em}
.handbar{position:absolute;left:0;width:100%;border-radius:10px;background:#e4e1dc;border:1px solid rgba(0,0,0,.1)}
.card{position:absolute;left:0;top:0;border-radius:3px;overflow:hidden;cursor:pointer;
  transition:transform .7s cubic-bezier(.2,.8,.2,1), opacity .45s ease, box-shadow .3s;
  box-shadow:0 3px 8px rgba(0,0,0,.28);background:#3a1a10}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:8px;line-height:1.1;padding:3px;background:linear-gradient(#a9562a,#5d2a12);color:#fff}
.card .back,.pile{background:
  radial-gradient(ellipse 30% 22% at 50% 50%, #e07a3a 0 40%, transparent 42%),
  radial-gradient(ellipse 42% 34% at 50% 50%, #7a1c14 0 60%, transparent 62%),
  linear-gradient(135deg,#3b130d,#20080a 60%,#3b130d)}
.card .back{position:absolute;inset:0;display:none;border:2px solid #4a2a16}
.card .back::after,.pile::after{content:"";position:absolute;inset:16% 12%;border:1.5px solid rgba(226,178,90,.65);border-radius:50%}
.card.down .back{display:block}
.card.down img,.card.down .fb{visibility:hidden}
.card.act{box-shadow:0 0 0 2px var(--gold),0 0 18px 4px rgba(240,98,58,.8);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--gold),0 0 28px 8px rgba(240,98,58,.95)}}
.pile{position:absolute;border-radius:3px;border:2px solid #4a2a16;box-shadow:2px 3px 0 #1a0606,4px 6px 0 #120404}
.pile .n{position:absolute;bottom:-1px;right:2px;font-size:10px;color:var(--gold);font-weight:600;z-index:1}
.flash{position:absolute;border-radius:50%;border:2px solid var(--gold);pointer-events:none;
  box-shadow:0 0 30px 6px rgba(226,178,90,.8), inset 0 0 20px rgba(240,98,58,.8);animation:flash 1s ease-out forwards;z-index:80}
@keyframes flash{from{transform:scale(.2);opacity:1}to{transform:scale(1.7);opacity:0}}
.banner{position:absolute;left:0;right:0;text-align:center;font-family:var(--display);font-weight:700;color:var(--gold);
  text-shadow:0 0 10px #fff,0 0 4px #fff,0 2px 6px rgba(200,50,58,.6);color:#b3261e;pointer-events:none;z-index:90;animation:ban 1.4s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.3)}20%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
.panel{display:grid;gap:10px;align-content:start}
.caption{background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:10px;padding:12px 14px;min-height:96px}
.caption .k{font-family:var(--display);font-size:13px;color:var(--gold);margin-bottom:4px}
.caption p{margin:0}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctrls .sp{margin-left:auto;font-size:14px;color:var(--mute);display:flex;gap:6px;align-items:center}
select{font-family:var(--ui);font-size:15px;background:#fff;color:var(--bone);border:1px solid rgba(0,0,0,.2);border-radius:6px;padding:8px}
.opts{display:grid;gap:6px}
.opts button{text-align:left}
.opts button.bad{border-color:var(--ember);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fbk{font-size:15px;color:var(--mute);min-height:22px}
.fbk.ok{color:#2e7d32}.fbk.no{color:#c62828}
.deckview{display:none}
.deckview h2{font-family:var(--display);font-size:16px;color:var(--gold);margin:14px 0 8px;font-weight:500}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.dcard{position:relative;cursor:pointer;border-radius:4px;overflow:hidden;aspect-ratio:59/86;background:#3a1a10;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.dcard img{width:100%;height:100%;object-fit:cover}
.dcard .q{position:absolute;right:3px;bottom:3px;background:var(--deep);color:var(--gold);border:1px solid var(--gold);border-radius:4px;font-size:12px;padding:0 5px}
.modal{position:fixed;inset:0;background:rgba(30,25,25,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal.on{display:flex}
.mbox{max-width:760px;width:100%;max-height:min(62vh,520px);background:#fbfaf8;
  border:1px solid var(--gold);border-radius:12px;padding:10px;display:grid;gap:10px;grid-template-columns:34% minmax(0,1fr);align-items:start}
.mbox img{width:100%;border-radius:5px;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.mtext{display:flex;flex-direction:column;gap:8px;max-height:calc(min(62vh,520px) - 20px);min-height:0}
.mscroll{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}
.mbox h3{font-family:var(--display);color:var(--gold);margin:0;font-size:15px;line-height:1.2}
.mbox .role{background:rgba(226,178,90,.1);border-left:3px solid var(--gold);padding:6px 8px;font-size:13px;line-height:1.35}
.mbox .desc{font-size:12px;line-height:1.45;color:var(--mute);white-space:pre-line}
.mbox #mClose{flex:none;padding:9px}
@media (min-width:760px){.mbox{grid-template-columns:300px minmax(0,1fr);padding:14px;gap:14px}
  .mbox h3{font-size:19px}.mbox .role{font-size:15px}.mbox .desc{font-size:14px}}
.pview{max-width:760px;width:100%;max-height:min(70vh,600px);background:#fbfaf8;border:1px solid var(--gold);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pview h3{font-family:var(--display);color:var(--gold);margin:0;font-size:17px}
.pview .pg{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;min-height:0}
.pview .pc{touch-action:none;position:relative;aspect-ratio:59/86;border-radius:4px;overflow:hidden;background:#3a1a10;cursor:pointer;font-size:10px;color:var(--mute);display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.pview .pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pview .pc .q{position:absolute;right:2px;bottom:2px;background:var(--deep);color:var(--gold);border:1px solid var(--gold);border-radius:4px;font-size:11px;padding:0 4px;z-index:1}
.pview .empty{color:var(--mute);font-size:14px}
.stage{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
header{flex-wrap:wrap}
#cap.bad{color:#c62828}
.pcard{touch-action:none;-webkit-user-drag:none}
.pcard img{pointer-events:none}
.card.pick{box-shadow:0 0 0 3px var(--gold),0 0 16px 4px rgba(226,178,90,.9)}
.card .lv{position:absolute;top:1px;left:1px;z-index:2;font-size:8px;line-height:1.2;padding:0 2px;border-radius:2px;background:rgba(0,0,0,.72);color:var(--gold)}
.card .lv:empty{display:none}.card .lv.mod{background:var(--ember);color:#fff}
.toast{position:absolute;left:4%;right:4%;transform:translateY(-50%);z-index:400;text-align:center;font-size:14px;line-height:1.35;
  background:#fff;color:var(--bone);border:1px solid var(--gold);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:9px 12px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}.toast.bad{border-color:var(--ember);color:#b3261e;box-shadow:0 0 14px rgba(200,50,58,.4)}
.selbar{background:rgba(226,178,90,.12);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.selbar p{margin:0;font-size:15px}
.pstat{font-size:14px;color:var(--mute)}
.pstatrow{display:flex;align-items:center;gap:9px}
.bigcard{position:fixed;inset:0;z-index:300;background:rgba(20,16,16,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.bigcard img{max-width:100%;max-height:calc(100% - 40px);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.bigcard p{color:#fff;opacity:.75;margin:10px 0 0;font-size:14px}
#mImg{cursor:zoom-in}
.owe{display:none;flex:none;vertical-align:-1px;margin-right:8px;width:13px;height:13px;border-radius:50%;background:#bdb5ab;border:1px solid rgba(0,0,0,.45);transition:background .3s,box-shadow .3s}
body.playing .owe{display:inline-block}
.owe.on{background:#ff3b30;border-color:#ffb3ad;box-shadow:0 0 6px 2px rgba(255,59,48,.75);animation:owe 1.1s ease-in-out infinite}
@keyframes owe{50%{box-shadow:0 0 14px 5px rgba(255,59,48,.9)}}
#pUndo:disabled{opacity:.4}
.dmode{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute)}
.dmode button{padding:6px 9px;font-size:13px}
.dmode button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.mbtns{display:flex;gap:8px;flex:none}.mbtns button{flex:1;padding:9px}
#mCoach.on{background:rgba(226,178,90,.18)}
.coach h4{font-family:var(--display);color:var(--gold);margin:4px 0 2px;font-size:13px;font-weight:500;letter-spacing:.04em}
.coach ul{margin:0;padding-left:18px;font-size:13px;line-height:1.4;display:grid;gap:4px}
.coach .now li{color:#8a4b00}.coach .dont li::marker{color:#c62828}
.lvrow{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}.lvrow button{padding:4px 10px}
.sheet{max-width:420px;width:100%;max-height:82vh;overflow:auto;background:#fbfaf8;border:1px solid var(--gold);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px}
.sheet .hd{display:flex;gap:10px;align-items:center;margin-bottom:2px}
.sheet .hd img{width:52px;border-radius:3px}
.sheet h3{font-family:var(--display);color:var(--gold);margin:0;font-size:16px}
.sheet .hd p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.sheet button{text-align:left}.sheet button.cancel{text-align:center;margin-top:4px}
@media (min-width:980px){.main{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:18px;align-items:start}}
.status{font-size:13px;color:var(--mute);text-align:center}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card.act,.flash,.banner,.opts button.bad{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Crimson Powerforce</h1>
    <div class="tabs" role="tablist">
      <button id="tWatch" class="on">Watch</button>
      <button id="tPractice">Practice</button>
      <button id="tPlay">Play</button>
      <button id="tDeck">Deck</button>
    </div>
  </header>

  <div class="main" id="duelview">
    <div>
      <div class="lp"><span>Opponent<b>8000</b></span><span><span id="owe" class="owe" role="status" aria-label=""></span>You<b>8000</b></span></div>
      <div class="stage" id="stage"></div>
      <div class="status" id="status">Loading card images…</div>
    </div>
    <div class="panel">
      <div class="caption"><div class="k" id="stepk"></div><p id="cap"></p></div>
      <div id="watchCtrls" class="ctrls">
        <button id="bPrev" aria-label="Previous step">◀ Back</button>
        <button id="bPlay" class="primary">Auto play</button>
        <button id="bNext" aria-label="Next step">Next ▶</button>
        <button id="bReset">Restart</button>
        <button id="bRand">🎲 Random hand</button>
        <button id="bOrig" style="display:none">Sample hand</button>
        <button id="bTurn" class="primary" style="display:none">Next turn ▶</button>
        <label class="sp">Speed
          <select id="speed"><option value="1.6">Slow</option><option value="1" selected>Normal</option><option value="0.6">Fast</option></select>
        </label>
      </div>
      <div id="practice" style="display:none" class="panel">
        <div class="k" style="font-family:var(--display);color:var(--gold)">What’s your next move?</div>
        <div class="opts" id="opts"></div>
        <div class="fbk" id="fbk"></div>
        <div class="ctrls"><button id="qUndo" disabled>↶ Undo</button><button id="pReset">Start over</button><button id="bRand2">🎲 Random hand</button><button id="bTurn2" class="primary" style="display:none">Next turn ▶</button><span class="sp" id="score"></span></div>
      </div>
      <div id="playCtrls" style="display:none" class="panel">
        <div id="selBar" class="selbar" style="display:none"><p id="selT"></p>
          <div class="ctrls"><button id="selOk" class="primary">Confirm</button><button id="selNo">Cancel</button></div></div>
        <div class="ctrls"><button id="pNext" class="primary">End turn</button><button id="pUndo" disabled>↶ Undo</button><button id="pBan">Banished (0)</button><button id="pNew">New duel</button></div>
        <div class="pstat" id="pstat"></div>
        <div class="dmode" id="dmode">Play cards as:
          <button data-m="normal" class="on">Normal Summon</button><button data-m="set">Set</button><button data-m="spa">Special ATK</button><button data-m="spd">Special DEF</button></div>
      </div>
      <p id="hint" style="font-size:14px;color:var(--mute);margin:0">Tap any card on the field or in your hand to see its art and full text.</p>
    </div>
  </div>

  <div class="deckview" id="deckview"></div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="mbox" id="mbox"></div>
</div>

<script>
const API = "https://db.ygoprodeck.com/api/v7/cardinfo.php?name=";
const CACHE_KEY = "cpf-cards-v2";
const BAKED = {"Synkron Resonator":{"type":"Tuner Monster","level":1,"attribute":"DARK","race":"Fiend","id":77360173,"desc":"If a Synchro Monster is on the field, you can Special Summon this card (from your hand). You can only Special Summon \"Synkron Resonator\" once per turn this way. If this card is sent from the field to the GY: You can target 1 \"Resonator\" monster in your GY, except \"Synkron Resonator\"; add it to your hand."},"Red Resonator":{"type":"Tuner Monster","level":2,"attribute":"FIRE","race":"Fiend","id":40975574,"desc":"When this card is Normal Summoned: You can Special Summon 1 Level 4 or lower monster from your hand. When this card is Special Summoned: You can target 1 face-up monster on the field; gain LP equal to its ATK. You can only use this effect of \"Red Resonator\" once per turn."},"Crimson Resonator":{"type":"Tuner Monster","level":2,"attribute":"DARK","race":"Fiend","id":34761841,"desc":"If you control no monsters: You can Special Summon this card from your hand. If the only other monster you control is exactly 1 DARK Dragon Synchro Monster: You can Special Summon up to 2 \"Resonator\" monsters from your hand or Deck, except \"Crimson Resonator\". You can only use each effect of \"Crimson Resonator\" once per turn. You cannot Special Summon monsters from the Extra Deck, except DARK Dragon Synchro Monsters, the turn you activate either of this card's effects."},"Vision Resonator":{"type":"Tuner Monster","level":2,"attribute":"DARK","race":"Fiend","id":98396890,"desc":"If a Level 5 or higher DARK monster is on the field, you can Special Summon this card (from your hand). You can only Special Summon \"Vision Resonator\" once per turn this way. If this card is sent to the GY: You can add 1 Spell/Trap that mentions \"Red Dragon Archfiend\" from your Deck to your hand. You can only use this effect of \"Vision Resonator\" once per turn."},"Red Lotus King, Flame Crime":{"type":"Effect Monster","level":3,"attribute":"FIRE","race":"Fiend","id":19299793,"desc":"During the Main Phase, if you control a Fiend Tuner, or your opponent controls a Special Summoned monster (Quick Effect): You can Special Summon this card from your hand. If this card is Special Summoned: You can inflict 400 damage to your opponent for each FIRE monster you control with different names. If this card is sent to the GY as Synchro Material: You can send 1 Normal Trap from your Deck to the GY. You can only use each effect of \"Red Lotus King, Flame Crime\" once per turn."},"Creation Resonator":{"type":"Tuner Monster","level":3,"attribute":"WIND","race":"Fiend","id":5780210,"desc":"If you control a Level 8 or higher Synchro Monster, you can Special Summon this card (from your hand)."},"Soul Resonator":{"type":"Tuner Monster","level":3,"attribute":"FIRE","race":"Fiend","id":62991792,"desc":"If this card is Normal or Special Summoned: You can add 1 Level 4 or lower Fiend monster from your Deck to your hand, except \"Soul Resonator\", also you cannot Special Summon monsters from the Extra Deck for the rest of this turn, except DARK Synchro Monsters. If a card(s) you control would be destroyed by card effect, while you control \"Red Dragon Archfiend\" or a Synchro Monster that mentions it, you can banish this card from your GY instead. You can only use each effect of \"Soul Resonator\" once per turn."},"Wandering King Wildwind":{"type":"Effect Monster","level":4,"attribute":"DARK","race":"Fiend","id":52589809,"desc":"If you control a Fiend Tuner with 1500 or less ATK, you can Special Summon this card (from your hand). If Summoned this way, you cannot Special Summon monsters from the Extra Deck for the rest of this turn, except Synchro Monsters. During your Main Phase, except the turn this card was sent to the GY: You can banish this card from your GY; add 1 Fiend Tuner with 1500 or less ATK from your Deck to your hand."},"Bone Archfiend":{"type":"Effect Monster","level":4,"attribute":"DARK","race":"Fiend","id":25784595,"desc":"If this card is in your hand or GY: You can send 1 other card from your hand or field to the GY; Special Summon this card, also you cannot Special Summon monsters from the Extra Deck for the rest of this turn, except DARK Dragon Synchro Monsters. You can target 1 face-up monster you control that has a Level; send 1 Fiend Tuner from your hand or Deck to the GY, and if you do, increase or decrease that monster's Level by 1. You can only use each effect of \"Bone Archfiend\" once per turn."},"Resonator Call":{"type":"Spell Card","race":"Normal","id":23008320,"desc":"Add 1 \"Resonator\" monster from your Deck to your hand."},"Crimson Gaia":{"type":"Spell Card","race":"Continuous","id":98173209,"desc":"During your Main Phase: You can add 1 \"Red Dragon Archfiend\" or 1 card that mentions it from your Deck or GY to your hand, except \"Crimson Gaia\". When your \"Red Dragon Archfiend\" declares an attack: You can change all monsters your opponent controls to face-down Defense Position. If a monster(s) on the field is destroyed by battle or card effect: You can Special Summon 1 \"Red Dragon Archfiend\" from your GY. You can only use each effect of \"Crimson Gaia\" once per turn."},"Resonator Command":{"type":"Spell Card","race":"Quick-Play","id":8559524,"desc":"Discard 1 \"Resonator\" monster; add 1 Level 4 or lower Fiend monster from your Deck to your hand. You can only activate 1 \"Resonator Command\" per turn."},"Absolute Powerforce":{"type":"Spell Card","race":"Quick-Play","id":51779204,"desc":"Target 1 \"Red Dragon Archfiend\" you control; if that monster you control battles an opponent's monster this turn, apply these effects until the end of the Damage Step.\n● It gains 1000 ATK.\n● Your opponent cannot activate cards or effects.\n● If it attacks a Defense Position monster, inflict piercing battle damage to your opponent.\n● Any battle damage your opponent takes from that battle is doubled."},"Red Reign":{"type":"Trap Card","race":"Normal","id":5376159,"desc":"If you control a Leve let DB = {};
async function loadDB(){
  // Card text, Levels and types are built into the app, so nothing depends on the card database website.
  for(const n in BAKED){ const b=BAKED[n]; DB[n]={img:IMG(b.id), small:IMG_S(b.id), desc:b.desc, type:b.type, level:b.level, attribute:b.attribute, race:b.race}; }
}
// Download every picture at the same time, then show them all together.
function preloadImages(){
  const urls=[]; for(const n in DB){ urls.push(DB[n].img, DB[n].small); }
  const one=u=>new Promise(ok=>{ const im=new Image(); const t=setTimeout(()=>ok(false),8000); im.onload=()=>{ clearTimeout(t); ok(true); }; im.onerror=()=>{ clearTimeout(t); ok(false); }; im.src=u; });
  return Promise.all(urls.map(one));
}

function layout(){
  const W = Math.min(stage.parentElement.clientWidth, 600);
  const cell = W/7, cw = cell*0.82, ch = cw*86/59, rowH = ch*1.1, handH = rowH*1.25;
  G = {W, cell, cw, ch, rowH, boardH: rowH*5, handH};
  stage.style.width = W+"px"; stage.style.height = (G.boardH + 8 + handH)+"px";
  stage.querySelectorAll(".board,.handbar,.pile").forEach(e=>e.remove());
  const board = document.createElement("div"); board.className="board"; board.style.height=G.boardH+"px";
  const cx = W/2, cy = rowH*2.5;
  [[rowH*1.9,""],[rowH*1.35," two"]].forEach(([r,c])=>{const s=document.createElement("div");s.className="sigil"+c;
    s.style.cssText=`width:${r*2}px;height:${r*2}px;left:${cx-r}px;top:${cy-r}px`;board.appendChild(s)});
  const ml=document.createElement("div");ml.className="midline";ml.style.top=(rowH*2.5)+"px";board.appendChild(ml);
  for(const [k,[r,c]] of Object.entries(Z)){
    const z=document.createElement("div"); z.className="zone"+(k.startsWith("o")?" opp":"")+(k.startsWith("emz")?" emz":"");
    const x=(c+.5)*cell, y=(r+.5)*rowH, w = k.startsWith("emz")? cw*1.15 : cw*1.06, h = k.startsWith("emz")? ch*1.02 : ch*1.04;
    z.style.cssText=`width:${w}px;height:${h}px;left:${x-w/2}px;top:${y-h/2}px`;
    if(LABEL[k]){const l=document.createElement("div");l.className="lab";l.textContent=LABEL[k];z.appendChild(l);}
    board.appendChild(z);

  stage.appendChild(board);
  const hb=document.createElement("div");hb.className="handbar";hb.style.top=(G.boardH+8)+"px";hb.style.height=handH+"px";stage.appendChild(hb);

function center(k){ const [r,c]=Z[k]; return [(c+.5)*G.cell, (r+.5)*G.rowH]; }

function stateAt(i){
  const s={}; let t=0; for(const id in INIT) s[id]={z:INIT[id], f:"up", t:t++};
  for(let k=1;k<=i;k++) for(const [id,z,f] of STEPS[k].ops) s[id]={z, f:f||"up", t:t++};
  return s;
}

let cur=0;
function render(i, animate=true){
  const s=stateAt(i), step=STEPS[i];
  const hand=Object.keys(s).filter(id=>s[id].z==="hand").sort((a,b)=>s[a].t-s[b].t);
  const gy=Object.keys(s).filter(id=>s[id].z==="gy").sort((a,b)=>s[a].t-s[b].t);
  const hs = 1.2, hw=G.cw*hs, n=hand.length;
  const gap = n>1 ? Math.min(hw*1.08, (G.W-hw-16)/(n-1)) : 0;
  const hx0 = G.W/2 - gap*(n-1)/2, hy = G.boardH + 8 + G.handH/2;
  for(const id in s){
    const el=cardEls[id], c=s[id]; let x,y,sc=1,op=1,zi=10;
    if(!animate) el.style.transition="none";
    el.style.width=G.cw+"px"; el.style.height=G.ch+"px";
    if(c.z==="hand"){ const k=hand.indexOf(id); x=hx0+k*gap; y=hy; sc=hs; zi=50+k; }
    else if(c.z==="gy"){ const k=gy.indexOf(id); [x,y]=center("gy"); y-=k*1.5; zi=20+k; }
    else if(c.z==="deck"||c.z==="extra"||c.z==="ban"){ [x,y]=center(c.z==="ban"?"gy":c.z); op=0; sc=.92; zi=2; }
    else { [x,y]=center(c.z); zi=30; }
    el.style.transform=`translate(${x-G.cw/2}px,${y-G.ch/2}px) scale(${sc})`;
    el.style.opacity=op; el.style.zIndex=zi; el.style.pointerEvents=op?"auto":"none";
    el.classList.toggle("down", c.f==="down");
    el.classList.toggle("act", !!(step.act && step.act.includes(id)));
    if(!animate){ el.offsetHeight; el.style.transition=""; }
  }
  updatePileCounts();

function expand(list){ const o=[]; list.forEach(([q,n])=>{for(let i=0;i<q;i++)o.push(n)}); return o; }
function pileContents(k, i){
  const st=stateAt(i);
  if(k==="gy") return Object.keys(st).filter(id=>st[id].z==="gy").sort((a,b)=>st[b].t-st[a].t).map(id=>INST[id]);
  const src = k==="extra" ? expand(DECK["Extra Deck"]) : expand([...DECK.Monsters,...DECK.Spells,...DECK.Traps]);
  for(const id in st){ const home = k==="extra" ? INIT[id]==="extra" : (INIT[id]==="deck"||INIT[id]==="hand");
    if(home && st[id].z!==k){ const j=src.indexOf(INST[id]); if(j>=0) src.splice(j,1); } }
  return src;
}
function updatePileCounts(){
  if(mode==="play"){ const set=(k,n)=>{ const el=stage.querySelector(`.pile[data-k="${k}"] .n`); if(el) el.textContent=n; };
    set("deck",P.deck.length); set("extra",Object.values(P.cards).filter(c=>c.where==="extra").length); return; }
  ["deck","extra"].forEach(k=>{ const el=stage.querySelector(`.pile[data-k="${k}"] .n`); if(el) el.textContent=pileContents(k,cur).length; });
}
const PNAME={gy:"Graveyard",deck:"Deck",extra:"Extra Deck"};
function openPile(k){
  if(mode==="play") return openPlayPile(k);
  const list=pileContents(k,cur); const counts={}; const order=[];
  list.forEach(n=>{ if(!counts[n]){counts[n]=0;order.push(n);} counts[n]++; });
  if(k!=="gy") order.sort();
  const box=document.getElementById("mbox"); box.className="pview";
  box.innerHTML=`<h3>${PNAME[k]} (${list.length})</h3>` + (list.length?`<div class="pg">`+order.map(n=>{const d=DB[n]||{};
    return `<div class="pc" data-n="${n.replace(/"/g,"&quot;")}">${d.small||d.img?`<img src="${d.small||d.img}" alt="">`:n}${counts[n]>1?`<span class="q">×${counts[n]}</span>`:""}</div>`}).join("")+`</div>`
    :`<div class="empty">No cards here yet.</div>`) + `<button id="mClose">Close</button>`;
  box.querySelectorAll(".pc").forEach(e=>e.onclick=()=>openCard(e.dataset.n));
  document.getElementById("mClose").onclick=closeCard;
  modal.classList.add("on");

function pileAt(x,y){
  for(const k of ["gy","deck","extra"]){ const [cx,cy]=center(k); if(Math.abs(x-cx)<G.cell/2 && Math.abs(y-cy)<G.rowH/2) return k; }
  return null;
}
(function(){
  let t=null, fired=false, sx=0, sy=0;
  stage.addEventListener("pointerdown",e=>{
    const r=stage.getBoundingClientRect(); const k=pileAt(e.clientX-r.left,e.clientY-r.top); fired=false; if(!k) return;
    sx=e.clientX; sy=e.clientY; t=setTimeout(()=>{ fired=true; if(navigator.vibrate) navigator.vibrate(15); openPile(k); },450);
  });
  const cancel=()=>{ clearTimeout(t); t=null; };
  stage.addEventListener("pointermove",e=>{ if(t && Math.hypot(e.clientX-sx,e.clientY-sy)>10) cancel(); });
  stage.addEventListener("pointerup",cancel); stage.addEventListener("pointercancel",cancel);
  stage.addEventListener("click",e=>{
    if(suppressClick){ suppressClick=false; e.stopPropagation(); return; }
    if(fired){ e.stopPropagation(); e.preventDefault(); fired=false; return; }
    const r=stage.getBoundingClientRect(); const k=pileAt(e.clientX-r.left,e.clientY-r.top);
    if(k==="deck"||k==="extra"||(k==="gy"&&!e.target.closest(".card"))) openPile(k);
  },true);
  stage.addEventListener("contextmenu",e=>{ if(pileAt(e.clientX-stage.getBoundingClientRect().left,e.clientY-stage.getBoundingClientRect().top)) e.preventDefault(); });

}

function ask(){
  const opts=document.getElementById("opts"), fb=document.getElementById("fbk"); opts.innerHTML="";
  document.getElementById("score").textContent = tries ? `First-try correct: ${right} of ${tries}` : "";
  if(cur>=STEPS.length-1){ fb.className="fbk ok"; fb.textContent="Turn complete. Tap Next turn to keep going, or start over to run it again."; return; }
  const nx=STEPS[cur+1]; let missed=false;
  qUndoBtn();
  if(nx.auto){ fb.className="fbk"; fb.textContent=nx.opp?"Your opponent takes their turn…":"Drawing a card…"; go(cur+1); qTimer=setTimeout(ask,1800); return; }
  shuffle([nx.q, ...nx.w]).forEach(t=>{

      if(t===nx.q){ qHist.push({cur,right,tries}); if(qHist.length>300) qHist.shift(); tries++; if(!missed) right++; fb.className="fbk ok"; fb.textContent="Correct."; go(cur+1); qUndoBtn(); qTimer=setTimeout(ask, 900); }

function nowTips(n,u){

    const L=d&&d.level; if(L>=7) out.push(`It’s Level ${L}, so a Normal Summon needs 2 Tributes.`); else if(L>=5) out.push(`It’s Level ${L}, so a Normal Summon needs 1 Tribute.`);
    out.push(P.normalUsed? "You’ve already used your Normal Summon this turn. To play it now, you need a card effect that Special Summons it." : "Your Normal Summon is still available this turn.");
    out.push("Pick Normal Summon, Set, or Special below the field, then drag it onto a Monster Zone.");
  }
  if(w==="hand" && k==="spell") out.push("Drag it onto a Spell & Trap Zone to activate it, or choose Set below the field first to Set it face-down."+(subType(n)==="Field"?" Field Spells go in the Field Zone.":""));
  if(w==="hand" && k==="trap") out.push("Drag it onto a Spell & Trap Zone to Set it. You can activate it starting next turn.");
  if(w==="extra"){ const req=d? d.desc.split("\n")[0] : ""; if(req) out.push(`Materials: ${req}`);
    if(P.lock && !matchWords(n,P.lock.words)) out.push(`Locked out: after ${P.lock.src}, you can only Special Summon ${P.lock.text} monsters from the Extra Deck this turn.`);
    out.push("Open your Extra Deck and drag it onto a Monster Zone, then tap the materials and Confirm."); }
  if(isZone(w) && c.pos==="set" && k==="trap") out.push(c.placedTurn===P.turn? "You Set it this turn, so it can’t be activated until your next turn." : "It’s ready. Hold it to activate it.");
  if(isMonZone(w)){ if(c.placedTurn===P.turn) out.push("It was put on the field this turn, so its battle position can’t change yet.");
    else out.push("Double-tap it to change its battle position."); }
  if(w==="deck"){ const ok=["hand","gy","field"].filter(dst=>!deckCheck(u,dst).err); out.push(ok.length? `An effect you used lets you take this card: ${ok.map(x=>DEST_WORD[x]).join(" or ")}.` : "No effect you’ve used right now lets this card leave your Deck."); }

const P = {};

const MZ=["m0","m1","m2","m3","m4"], SZ=["s0","s1","s2","s3","s4"], EMZ=["emzL","emzR"];
const FIELD=[...MZ,...EMZ,...SZ,"field"];
const KIND={}; for(const [sec,l] of Object.entries(DECK)) l.forEach(([q,n])=>KIND[n]= sec==="Monsters"?"mon":sec==="Spells"?"spell":sec==="Traps"?"trap":"extra");
const isZone=k=>FIELD.includes(k), isMonZone=k=>MZ.includes(k)||EMZ.includes(k);
const info=n=>DB[n]||null;
const isMonKind=n=>KIND[n]==="mon"||KIND[n]==="extra";
function lvl(u){ const c=P.cards[u], d=info(c.n); if(!d||d.level==null) return null; return Math.max(1,d.level+(c.lvMod||0)); }
function tuner(n){ const d=info(n); return d? /Tuner/.test(d.type) : null; }
function subType(n){ const d=info(n); return d? d.race : null; }
function occ(k){ for(const u in P.cards) if(P.cards[u].where===k) return u; return null; }
function monsters(){ return Object.keys(P.cards).filter(u=>isMonZone(P.cards[u].where)); }
function freeMZ(){ return MZ.find(k=>!occ(k)); }
function freeSZ(){ return SZ.find(k=>!occ(k)); }
const byT=(a,b)=>P.cards[a].t-P.cards[b].t;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
let suppressClick=false, drag=null, toastT=null;

function toast(msg,bad){
  let t=stage.querySelector(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; stage.appendChild(t); }
  t.textContent=msg; t.classList.toggle("bad",!!bad); t.classList.add("on");
  t.style.top=(G.rowH*2.5)+"px";
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"), bad?3600:2200);
}
function say(msg){ const c=document.getElementById("cap"); c.textContent=msg; c.className=""; const t=stage.querySelector(".toast"); if(t) t.classList.remove("on"); }
function no(msg){ const c=document.getElementById("cap"); c.textContent=msg; c.className="bad"; toast(msg,true);
  if(navigator.vibrate) navigator.vibrate([30,40,30]); renderPlay(); return false; }
function pstat(){
  document.getElementById("stepk").textContent=`Free play · Turn ${P.turn}`;
  let s = P.normalUsed ? "Normal Summon: used this turn" : "Normal Summon: available";
  if(P.lock) s += ` · Extra Deck: ${P.lock.text} only`;
  const gtx=grantText(); if(gtx) s += ` · Waiting: ${gtx}`;
  document.getElementById("pstat").textContent=s;
  const ow=document.getElementById("owe"); ow.classList.toggle("on",!!(P.owed||P.lvOwed)); ow.setAttribute("aria-label",(P.owed||P.lvOwed)?"Something still needs to be done":"");
  document.getElementById("pBan").textContent=`Banished (${Object.values(P.cards).filter(c=>c.where==="ban").length})`;
}

function newGame(){
  for(const u in pEls){ pEls[u].remove(); delete pEls[u]; }
  Object.assign(P,{cards:{},deck:[],t:0,turn:1,normalUsed:false,used:{},lock:null,sel:null,grants:[],owed:null}); hist=[]; lastState=null; P.grants=[];
  let id=0; const mk=(n,w)=>{ const u="p"+(id++); P.cards[u]={n,where:w,t:0}; return u; };
  const main=[]; ["Monsters","Spells","Traps"].forEach(s=>DECK[s].forEach(([q,n])=>{ for(let i=0;i<q;i++) main.push(mk(n,"deck")); }));
  DECK["Extra Deck"].forEach(([q,n])=>{ for(let i=0;i<q;i++) mk(n,"extra"); });
  P.deck=shuffle(main);
  for(const u in P.cards) makePEl(u);
  for(let i=0;i<5;i++) place(P.deck[P.deck.length-1],"hand");
  endSelect(); setDropMode("normal");
  say("New duel. You drew 5 cards. You’re going first, so there’s no draw this turn. Drag a card onto the field to play it. Tap any card for its details and tips.");
  renderPlay(false);
}
function place(u,where,o={}){
  const c=P.cards[u]; const i=P.deck.indexOf(u); if(i>=0) P.deck.splice(i,1);
  if(KIND[c.n]==="extra" && (where==="hand"||where==="deck")) where="extra";
  c.prev=c.where; c.where=where; c.t=++P.t;
  if(!isZone(where)){ delete c.pos; c.lvMod=0; delete c.placedTurn; delete c.posTurn; }
  if(where==="extra") delete c.proper;
  if(where==="deck") P.deck.splice(Math.floor(Math.random()*(P.deck.length+1)),0,u);
  Object.assign(c,o);
}
function makePEl(u){
  const n=P.cards[u].n, el=document.createElement("div"); el.className="card pcard"; el.style.display="none";
  el.innerHTML=`<div class="fb">${esc(n)}</div><div class="back"></div><span class="lv"></span>`;
  addImg(el,n); stage.appendChild(el); pEls[u]=el;
  el.addEventListener("pointerdown",e=>{
    const c=P.cards[u]; if(!(c.where==="hand"||isZone(c.where))) return;
    e.preventDefault(); try{ el.setPointerCapture(e.pointerId); }catch(_){}
    drag={u,sx:e.clientX,sy:e.clientY,moved:false,long:false,r:stage.getBoundingClientRect()};
    const dd=drag; dd.lp=setTimeout(()=>{ if(drag===dd && !dd.moved && !P.sel){ dd.long=true; if(navigator.vibrate) navigator.vibrate(20); holdCard(u); } },500);
  });
  el.addEventListener("pointermove",e=>{
    if(!drag||drag.u!==u||P.sel||drag.long) return;
    if(!drag.moved && Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<8) return;
    drag.moved=true; clearTimeout(drag.lp); el.style.transition="none"; el.style.zIndex=300;
    const x=e.clientX-drag.r.left, y=e.clientY-drag.r.top;
    el.style.transform=`translate(${x-G.cw/2}px,${y-G.ch/2}px) scale(1.3)`;
  });
  el.addEventListener("pointerup",e=>{
    if(!drag||drag.u!==u) return; const d=drag; drag=null; clearTimeout(d.lp); el.style.transition="";
    suppressClick=true; setTimeout(()=>suppressClick=false,400);
    if(d.long) return;
    if(d.moved){ dropAt(u,e.clientX-d.r.left,e.clientY-d.r.top,overBan(e)); renderPlay(); return; }
    const c=P.cards[u];
    if(P.sel || !isMonZone(c.where)) return tapCard(u);
    if(lastTap.u===u && Date.now()-lastTap.t<320){ clearTimeout(lastTap.tm); lastTap={}; return changePos(u); }
    lastTap={u,t:Date.now(),tm:setTimeout(()=>{ lastTap={}; tapCard(u); },320)};
  });
  el.addEventListener("pointercancel",()=>{ if(drag) clearTimeout(drag.lp); drag=null; el.style.transition=""; renderPlay(); });
}
let lastTap={};
function overBan(e){ return document.elementsFromPoint(e.clientX,e.clientY).some(x=>x.id==="pBan"); }
function holdCard(u){
  if(P.owed||P.lvOwed) return no(OWE_MSG);
  const c=P.cards[u], w=c.where;
  if(w==="hand") return useEffect(u);
  if(isMonZone(w)) return c.pos==="set"? changePos(u) : useEffect(u);
  if(isZone(w)) return c.pos==="set"? activateSet(u) : useEffect(u);
  if(w==="gy"||w==="ban") return useEffect(u);
  if(w==="deck"||w==="extra") return no("Cards in your Deck can’t use their effects from there. Drag it out when a card effect lets you.");
}
function addImg(el,n){ const d=DB[n]; if(d && !el.querySelector("img")){ const im=new Image(); im.alt=n; im.draggable=false; im.src=d.small||d.img;
  im.onload=()=>{ const f=el.querySelector(".fb"); if(f) f.style.display="none"; }; el.prepend(im); } }
function applyPImages(){ for(const u in pEls) addImg(pEls[u],P.cards[u].n); }

function zoneAt(x,y){
  for(const k in Z){ const [cx,cy]=center(k); if(Math.abs(x-cx)<G.cell/2 && Math.abs(y-cy)<G.rowH/2) return k; }
  return null;
}

function renderPlay(animate=true){
  if(!P.cards) return;
  const ids=Object.keys(P.cards);
  const hand=ids.filter(u=>P.cards[u].where==="hand").sort(byT);
  const gy=ids.filter(u=>P.cards[u].where==="gy").sort(byT);
  const hs=1.2, hw=G.cw*hs, n=hand.length;
  const gap=n>1? Math.min(hw*1.08,(G.W-hw-16)/(n-1)) : 0;
  const hx0=G.W/2-gap*(n-1)/2, hy=G.boardH+8+G.handH/2;
  for(const u of ids){
    const el=pEls[u], c=P.cards[u]; let x,y,sc=1,zi=10,rot=0,show=true;
    if(c.where==="hand"){ const k=hand.indexOf(u); x=hx0+k*gap; y=hy; sc=hs; zi=50+k; }
    else if(c.where==="gy"){ const k=gy.indexOf(u); [x,y]=center("gy"); y-=k*1.2; zi=20+k; }
    else if(isZone(c.where)){ [x,y]=center(c.where); zi=30; if(isMonZone(c.where) && (c.pos==="def"||c.pos==="set")) rot=90; }
    else show=false;
    if(!show){ el.style.display="none"; continue; }
    el.style.width=G.cw+"px"; el.style.height=G.ch+"px";
    if(el.style.display==="none"){
      el.style.display="";
      const src=["deck","extra","gy"].includes(c.prev)?c.prev:null;
      if(src && animate){ const [px,py]=center(src); el.style.transition="none";
        el.style.transform=`translate(${px-G.cw/2}px,${py-G.ch/2}px)`; el.offsetHeight; el.style.transition=""; }
    }
    if(!animate) el.style.transition="none";
    el.style.transform=`translate(${x-G.cw/2}px,${y-G.ch/2}px) scale(${sc}) rotate(${rot}deg)`;
    el.style.zIndex=zi; el.style.pointerEvents = c.where==="gy" ? "none" : "auto";
    el.classList.toggle("down", c.pos==="set");
    el.classList.toggle("pick", !!(P.sel && P.sel.picked.includes(u)));
    const L=isMonZone(c.where)&&c.pos!=="set"? lvl(u) : null;
    const lv=el.querySelector(".lv"); lv.textContent = L!=null? "★"+L : ""; lv.classList.toggle("mod", !!c.lvMod);
    if(!animate){ el.offsetHeight; el.style.transition=""; }
  }
  updatePileCounts(); pstat(); track();
}



// ---- Permissions: a card only leaves the Deck or GY when an effect says it can ----
const DEST_WORD={hand:"add to your hand",gy:"send to the GY",field:"Special Summon"};
const LOCW=t=>{ const o=[]; if(/\bhand\b/i.test(t)) o.push("hand"); if(/\b(GY|Graveyard)\b/.test(t)) o.push("gy");
  if(/\bfield\b|you control|Monster Zone/i.test(t)) o.push("field"); if(/\bDeck\b/.test(t)) o.push("deck"); return o; };
const SRC_WORD={deck:"Deck",gy:"GY",hand:"hand"};
function parseGrants(n,txt){
  const d=info(n); if(!d||!d.desc) return [];
  const out=[];
  (txt||d.desc).split(".").forEach(sent=>{
    // "target 1 X in your GY; Special Summon it" / "add it to your hand"
    const tg=/target (?:up to )?(\d+) (.+?) in your ((?:hand,? |Deck,? |or |and )*(?:GY|Graveyard))(?:,? except "([^"]+)")?\s*;(.*)$/i.exec(sent);
    if(tg){ const rest=tg[5], dest= /Special Summon (?:it|them|both|that)/i.test(rest)?"field" : /add (?:it|them|both|that card)\b.*to your hand/i.test(rest)?"hand" : null;
      if(dest) out.push({src:n, dest, left:+tg[1], phrase:tg[2].trim(), except:tg[4]||null, from:LOCW(tg[3]).filter(x=>x!=="field")}); }
    const parts=sent.split(";");
    (parts.length>1?parts.slice(1):parts).forEach(cl=>{
      const re=/\b(add|send|Special Summon|Set)\s+(?:up to\s+)?(\d+)\s+(.+?)\s+from your ([^,]*?\b(?:Deck|GY|Graveyard)\b[^,]*?)(?:\s+to (?:your hand|the GY)|\s+in\b|,|$)/ig;
      let m; while((m=re.exec(cl))){
        const verb=m[1].toLowerCase(), ex=/except "([^"]+)"/i.exec(cl), from=LOCW(m[4]).filter(x=>x!=="field");
        out.push({src:n, dest: verb==="add"?"hand":verb==="send"?"gy":"field", left:+m[2], phrase:m[3].trim(), except: ex?ex[1]:null, from});
      }
    });
  });
  return out;
}
function grantFrom(n,txt){
  const g=parseGrants(n,txt); if(!g.length) return "";
  P.grants=(P.grants||[]).filter(x=>x.src!==n).concat(g);
  const fw=x=>x.from.map(f=>SRC_WORD[f]).join(" or ");
  const F={hand:(x)=>`add ${x.left} ${x.phrase} from your ${fw(x)} to your hand`,gy:(x)=>`send ${x.left} ${x.phrase} from your ${fw(x)} to the GY`,field:(x)=>`Special Summon ${x.left} ${x.phrase} from your ${fw(x)}`};
  return " "+g.map(x=>`You can now ${F[x.dest](x)}${x.except?`, except ${x.except}`:""}.`).join(" ");
}
function fitsPhrase(cand,phrase){
  const d=info(cand); if(!d) return true;
  const p=phrase.replace(/^other\s+/i,""), lc=p.toLowerCase(), k=KIND[cand], mon=isMonKind(cand);
  const firstQ=(/"([^"]+)"/.exec(p)||[])[1];
  const alts=p.split(/\s+or\s+(?=1\s|")/i).map(a=>a.replace(/^1\s+/,""));
  return alts.some(a=>{
    const al=a.toLowerCase(), q=(/"([^"]+)"/.exec(a)||[])[1];
    if(/mentions/.test(al)){ const tgt=q || firstQ; if(tgt && !(d.desc||"").includes(tgt)) return false; }
    else if(q){ if(!(cand===q || (/monster|card/.test(al) && cand.includes(q)))) return false; }
    if(/spell\/trap/.test(al)){ if(k!=="spell"&&k!=="trap") return false; }
    else if(/\bspell\b/.test(al)){ if(k!=="spell") return false; }
    else if(/\btrap\b/.test(al)){ if(k!=="trap") return false; }
    else if(/monster|tuner/.test(al) && !mon) return false;
    if(/normal trap/.test(al) && d.race!=="Normal") return false;
    if(/\btuner\b/.test(al) && !/Tuner/.test(d.type)) return false;
    const lx=/\blevel (\d+)\b(?! or)/.exec(al); if(lx && d.level!==+lx[1]) return false;
    const lv=/level (\d+) or (lower|higher)/.exec(al);
    if(lv){ if(d.level==null) return false; if(lv[2]==="lower"? d.level>+lv[1] : d.level<+lv[1]) return false; }
    for(const r of ["Fiend","Dragon","Warrior","Spellcaster","Machine","Zombie","Pyro"]) if(new RegExp("\\b"+r+"\\b").test(a.replace(/"[^"]*"/g,"")) && mon && d.race!==r) return false;
    for(const at of ["DARK","LIGHT","FIRE","WATER","EARTH","WIND"]) if(new RegExp("\\b"+at+"\\b").test(a) && d.attribute!==at) return false;
    return true;
  });
}
function permCheck(u,src,dest){
  const n=P.cards[u].n, gs=(P.grants||[]).filter(g=>g.dest===dest && (g.from||["deck"]).includes(src));
  const where={deck:"your Deck",gy:"your GY"}[src];
  const verb={hand:`add a card from ${where} to your hand`,gy:`send a card from ${where} to the GY`,field:`Special Summon from ${where}`,ban:`banish a card from ${where}`}[dest];
  if(!gs.length) return { err:`No card effect is letting you ${verb} right now. Use a card’s effect first by holding it, and it will tell you what you can take.` };
  const g=gs.find(g=>g.except!==n && !(/^other\b/i.test(g.phrase)&&g.src===n) && fitsPhrase(n,g.phrase));
  if(!g){ const x=gs[0]; return { err: x.except===n ? `${x.src}’s effect can’t take ${n}. It says “except ${n}”.` : `${x.src}’s effect only lets you ${DEST_WORD[x.dest]} ${x.left} ${x.phrase} from ${where}. ${n} doesn’t fit that.` }; }
  return {g};
}
const deckCheck=(u,dest)=>permCheck(u,"deck",dest);
function useGrant(g){ g.left--; if(g.left<=0){ const i=P.grants.indexOf(g); if(i>=0) P.grants.splice(i,1); } }
function grantText(){ return (P.grants||[]).map(g=>`${g.src}: ${DEST_WORD[g.dest]} ${g.left} ${g.phrase} from ${(g.from||["deck"]).map(f=>SRC_WORD[f]).join("/")}`).join(" · "); }

// ---- Effects and costs, read from the card's own text ----
function parseCost(t){
  t=t.trim().replace(/^\(Quick Effect\)\s*/i,"").replace(/^You can\s+/i,"").replace(/^you can\s+/,"");
  if(!t||/^target\b/i.test(t)) return null;
  let m;
  const mk=(act,m,from,to,extra)=>Object.assign({act,self:!m[2],need:m[2]?+m[2]:1,phrase:(m[3]||"card").trim(),from,to},extra||{});
  if((m=/^discard (this card|(\d+) (.+?))$/i.exec(t))) return mk("discard",m,["hand"],"gy");
  if((m=/^send (this card|(\d+) (.+?))(?: from (?:your )?(.+?))? to the (?:GY|Graveyard)$/i.exec(t))) return mk("send",m,m[4]?LOCW(m[4]):["field"],"gy");
  if((m=/^banish (this card|(\d+) (.+?))(?: from (?:your )?(.+?))?(?: face-up| face-down)?$/i.exec(t))) return mk("banish",m,m[4]?LOCW(m[4]):["gy"],"ban");
  if((m=/^Tribute (this card|(\d+) (.+?))$/i.exec(t))) return mk("tribute",m,["field"],"gy",{mon:true});
  return null;
}
function effectsOf(n){
  const d=info(n); if(!d||!d.desc) return [];
  let body=d.desc.replace(/\r/g,"");
  if(KIND[n]==="extra" && /\+/.test(body.split("\n")[0])) body=body.split("\n").slice(1).join(" ");
  return body.replace(/\s*\n+\s*/g," ").split(/(?<=\.)\s+(?=[A-Z(●])/).map(x=>x.trim()).filter(x=>x && !/^You can only/i.test(x)).map((x,i)=>{
    const semi=x.indexOf(";"), ci=x.indexOf(":"), hasHead= ci>=0 && (semi<0||ci<semi);
    const head= hasHead? x.slice(0,ci) : "";
    let locs=null;
    const m=/this card is (in your|banished)([^:]*)/i.exec(head);
    if(m) locs= /banished/i.test(m[1])? ["ban"] : LOCW(m[2]);
    else if(/this card is sent (?:from [^:]*)?to the GY/i.test(head)) locs=["gy"];
    let cost= semi>=0 ? parseCost(x.slice(hasHead?ci+1:0, semi)) : null;
    if(/you can banish this card from your GY instead/i.test(x)){ locs=["gy"]; cost={act:"banish",self:true,need:1,phrase:"card",from:["gy"],to:"ban"}; }
    if(cost && cost.self && cost.act==="discard") locs=["hand"];
    const res= semi>=0? x.slice(semi+1) : x;
    return {i, text:x, locs, cost, selfSS:/Special Summon this card/i.test(res)&&!!locs, activated:/\byou can\b/i.test(x)||semi>=0};
  });
}
const locOf=w=> w==="hand"||w==="gy"||w==="deck"||w==="ban"||w==="extra" ? w : isZone(w)? "field" : w;
const OWE_MSG="Something still needs to be done before you can make another move. Look back at the card you just used.";
function owe(u,e){ const c=e.cost; P.owed={u,src:P.cards[u].n,act:c.act,self:c.self,left:c.need,phrase:c.phrase,from:c.from,to:c.to,other:/^other\b/i.test(c.phrase),mon:!!c.mon}; }
function pays(u,dest){
  const o=P.owed; if(!o||dest!==o.to) return false;
  const c=P.cards[u]; if(!o.from.includes(locOf(c.where))) return false;
  if(o.self) return u===o.u;
  if(o.other && u===o.u) return false;
  if(o.mon && !isMonZone(c.where)) return false;
  return fitsPhrase(c.n,o.phrase);
}
function payOwed(u,dest){
  const o=P.owed, c=P.cards[u], n=c.n, from=locOf(c.where);
  const fw= from==="field"?" from the field":" "+(FROM[from]||"");
  place(u,dest); o.left--;
  const did= o.act==="discard"?`Discarded ${n}` : o.act==="tribute"?`Tributed ${n}` : dest==="ban"?`Banished ${n}${fw}` : `Sent ${n}${fw} to the GY`;
  if(o.left>0) say(`${did}. ${o.src}’s cost isn’t fully paid yet.`);
  else { P.owed=null; say(`${did} to pay for ${o.src}’s effect. Cost paid, so you can carry on.`); }
  renderPlay();
}
function effectsHere(u){
  const c=P.cards[u], from=locOf(c.where);
  return effectsOf(c.n).filter(e=>e.activated && !e.selfSS && (e.locs? e.locs.includes(from) : from==="field"));
}

// ---- Undo: every change to the duel is saved as one step ----
let hist=[], lastState=null, restoring=false;
function ser(){ return JSON.stringify({cards:P.cards,deck:P.deck,t:P.t,turn:P.turn,normalUsed:P.normalUsed,used:P.used,lock:P.lock,grants:P.grants||[],owed:P.owed||null,lvOwed:P.lvOwed||null,dm:dropMode}); }
function track(){
  if(restoring) return; const j=ser();
  if(lastState!==null && j!==lastState){ hist.push({s:lastState,cap:document.getElementById("cap").textContent}); if(hist.length>300) hist.shift(); }
  lastState=j; document.getElementById("pUndo").disabled=!hist.length;
}
function undo(){
  if(P.sel) endSelect();
  const h=hist.pop(); if(!h) return no("Nothing to undo yet.");
  const o=JSON.parse(h.s); Object.assign(P,{cards:o.cards,deck:o.deck,t:o.t,turn:o.turn,normalUsed:o.normalUsed,used:o.used,lock:o.lock,grants:o.grants||[],owed:o.owed||null,lvOwed:o.lvOwed||null});
  setDropMode(o.dm||"normal"); lastState=h.s;
  restoring=true; renderPlay(); restoring=false;
  document.getElementById("pUndo").disabled=!hist.length;
  say(`Undid: ${h.cap}`);
}
document.getElementById("pUndo").onclick=undo;

// ---- Selecting cards (Tributes, Synchro materials) ----
function startSelect(o){
  P.sel=Object.assign({picked:[]},o);
  document.getElementById("selT").textContent=o.title;
  document.getElementById("selOk").style.display = o.need ? "none" : "";
  document.getElementById("selBar").style.display="";
  say(o.title); renderPlay();
}
function endSelect(){ P.sel=null; document.getElementById("selBar").style.display="none"; }
document.getElementById("selNo").onclick=()=>{ endSelect(); say("Cancelled."); renderPlay(); };
document.getElementById("selOk").onclick=()=>{ const s=P.sel; if(!s) return; if(!s.picked.length) return no("Tap your monsters first to pick them."); s.done([...s.picked]); };

function tapCard(u){
  const c=P.cards[u];
  if(P.sel){
    if(!isMonZone(c.where)) return no("Pick monsters on your field.");
    if(P.sel.kind==="synchro" && c.pos==="set") return no("Face-down monsters can’t be used as Synchro Material.");
    const p=P.sel.picked, i=p.indexOf(u); i>=0? p.splice(i,1) : p.push(u);
    renderPlay();
    if(P.sel.need && p.length===P.sel.need) P.sel.done([...p]);
    return;
  }
  openCard(c.n,u);
}

// ---- Once-per-turn checks ----
function optCheck(n,ok){
  const d=info(n), txt=d?d.desc:"", k=P.used[n]||0;
  const each=/You can only use each effect of/i.test(txt);
  const hard=!each && /You can only (use this effect of|activate 1 )/i.test(txt);
  if(hard && k>=1) return no(`${n} can only be used once per turn, and you already used it this turn.`);
  if(each && k>=2) return no(`You’ve already used ${n}’s effects this turn. Each one works once per turn.`);
  if(each && k===1){
    return sheet(n,null,`Each of ${n}’s effects can only be used once per turn. Is this a different effect from the one you already used?`,
      [["Yes, it’s a different effect",()=>{ P.used[n]=2; ok(); }]]);
  }
  P.used[n]=k+1; ok();
}
function matchWords(n,words){
  const d=info(n); if(!d) return true;
  return words.every(w=> d.attribute===w.toUpperCase() || d.race===w || d.type.includes(w));
}

// ---- Summons ----
function tryNormal(u,zone,set){
  const c=P.cards[u];
  if(P.normalUsed) return no("You’ve already Normal Summoned or Set a monster this turn. You get one per turn.");
  if(zone && EMZ.includes(zone)) return no("Only monsters Summoned from the Extra Deck can go in an Extra Monster Zone.");
  const L=lvl(u), need = L==null?0 : L>=7?2 : L>=5?1 : 0, mons=monsters();
  if(need>mons.length) return no(`${c.n} is Level ${L}, so it needs ${need} Tribute${need>1?"s":""}. You only control ${mons.length} monster${mons.length===1?"":"s"}.`);
  const finish=tribs=>{
    endSelect(); tribs.forEach(t=>place(t,"gy"));
    const z = zone && !occ(zone) ? zone : freeMZ();
    if(!z) return no("All 5 of your Monster Zones are full.");
    P.normalUsed=true; place(u,z,{pos:set?"set":"atk",placedTurn:P.turn}); setDropMode("spa");
    say(set? `Set ${c.n} face-down in Defense Position.` : `Normal Summoned ${c.n}${tribs.length?` by Tributing ${tribs.length} monster${tribs.length>1?"s":""}`:""}.`);
    renderPlay();
  };
  if(need) return startSelect({kind:"tribute",need,title:`Tap ${need} monster${need>1?"s":""} to Tribute for ${c.n}.`,done:finish});
  if(zone && occ(zone)) return no("That zone already has a card in it.");
  if(!zone && !freeMZ()) return no("All 5 of your Monster Zones are full.");
  finish([]);
}
function trySpecial(u,zone,pos,how){
  const c=P.cards[u], ex=KIND[c.n]==="extra", src=locOf(c.where);
  if(ex && !c.proper) return no(`${c.n} was never properly Synchro Summoned, so it can’t be Special Summoned from the ${c.where==="gy"?"GY":"banishment"}.`);
  if(zone && EMZ.includes(zone) && !ex) return no("Only monsters Summoned from the Extra Deck can go in an Extra Monster Zone.");
  if(zone && occ(zone)) return no("That zone already has a card in it.");
  const z = zone || freeMZ() || (ex && !EMZ.some(occ) ? "emzL" : null);
  if(!z) return no("All your Monster Zones are full.");
  const from=c.where==="hand"?"your hand":c.where==="gy"?"your GY":c.where==="deck"?"your Deck":"banishment";
  const own = !ex && (src==="hand"||src==="gy") ? effectsOf(c.n).find(e=>e.selfSS && e.locs.includes(src)) : null;
  let grant=null;
  if(!how && (src==="hand"||src==="gy")){
    if(src==="gy"){ const r=permCheck(u,"gy","field"); grant=r.g||null;
      if(!own && !grant) return no(r.err); }
    else grant=(P.grants||[]).find(g=>g.dest==="field"&&(g.from||[]).includes("hand")&&g.except!==c.n&&fitsPhrase(c.n,g.phrase))||null;
    if(own && grant) return sheet(c.n,null,`How are you Special Summoning ${c.n}?`,[["With its own effect",()=>trySpecial(u,zone,pos,"own")],[`With ${grant.src}’s effect`,()=>trySpecial(u,zone,pos,"other")]]);
    how = own? "own" : grant? "other" : null;
  }
  if(how==="own" && own){
    return optCheck(c.n,()=>{
      place(u,z,{pos,placedTurn:P.turn});
      let extra="";
      const m=/cannot Special Summon monsters from the Extra Deck for the rest of this turn, except ([^.,]+?) monsters/i.exec(own.text);
      if(m){ P.lock={src:c.n,text:m[1].trim(),words:m[1].trim().split(/\s+/)}; extra=` From now on this turn you can only Special Summon ${P.lock.text} monsters from the Extra Deck.`; }
      if(own.cost) owe(u,own);
      const gt=grantFrom(c.n,own.text);
      say(`Special Summoned ${c.n} from ${from} with its own effect, in ${pos==="atk"?"Attack":"Defense"} Position.${extra}${gt}`);
      renderPlay();
    });
  }
  if(how==="other"){
    const g = grant || (src==="gy"? permCheck(u,"gy","field").g : (P.grants||[]).find(g=>g.dest==="field"&&(g.from||[]).includes("hand")&&g.except!==c.n&&fitsPhrase(c.n,g.phrase)));
    if(src==="gy" && !g) return no(permCheck(u,"gy","field").err);
    if(g) useGrant(g);
    place(u,z,{pos,placedTurn:P.turn});
    say(`Special Summoned ${c.n} from ${from} with ${g?g.src+"’s":"a card’s"} effect, in ${pos==="atk"?"Attack":"Defense"} Position.`);
    return renderPlay();
  }
  place(u,z,{pos,placedTurn:P.turn});
  say(`Special Summoned ${c.n} from ${from} in ${pos==="atk"?"Attack":"Defense"} Position. Remember this needs a card effect that allows it.`);
  renderPlay();
}
function startSynchro(u,zone){
  const c=P.cards[u], d=info(c.n);
  if(P.lock && !matchWords(c.n,P.lock.words)) return no(`You used ${P.lock.src}’s effect, so you can only Special Summon ${P.lock.text} monsters from the Extra Deck this turn.`);
  const faceUp=monsters().filter(m=>P.cards[m].pos!=="set");
  if(faceUp.length<2) return no("A Synchro Summon needs a Tuner and at least one other face-up monster on your field.");
  if(zone && occ(zone)) return no("That zone already has a card in it.");
  if(zone && EMZ.includes(zone) && EMZ.some(z=>z!==zone && occ(z))) return no("You can only use one Extra Monster Zone.");
  P.synZone=zone||null; startSynchroSelect(u, d);
}
function startSynchroSelect(u,d){
  const n=P.cards[u].n;
  startSelect({kind:"synchro",need:null,title:`Tap the materials for ${n}${d&&d.level?` (Level ${d.level})`:""}, then Confirm.`,done:m=>finishSynchro(u,m)});
}
function finishSynchro(u,mats){
  const n=P.cards[u].n, d=info(n);
  const req=d? d.desc.split("\n")[0] : "";
  const tm=/^\s*(\d+)\s+Tuners?/i.exec(req), needT=tm? +tm[1] : 1;
  const tun=mats.filter(m=>tuner(P.cards[m].n)), non=mats.filter(m=>tuner(P.cards[m].n)===false);
  if(d && tun.length!==needT) return no(`${n} needs exactly ${needT} Tuner${needT>1?"s":""} as material. You picked ${tun.length}.`);
  if(d && non.length<1) return no(`${n} also needs at least 1 non-Tuner monster as material.`);
  const named=/\+\s*"([^"]+)"/.exec(req);
  if(named && !non.some(m=>P.cards[m].n===named[1])) return no(`${n} needs “${named[1]}” as one of its materials.`);
  const nw=/non-Tuners?\s+(.*?)\s*[Mm]onsters?/.exec(req.split("+").slice(1).join("+"));
  if(nw && nw[1].trim()){ const words=nw[1].trim().split(/\s+/);
    if(!non.every(m=>matchWords(P.cards[m].n,words))) return no(`${n}’s non-Tuner material has to be a ${nw[1].trim()} monster.`); }
  const lv=mats.map(lvl);
  if(d && d.level && lv.every(x=>x!=null)){ const sum=lv.reduce((a,b)=>a+b,0);
    if(sum!==d.level) return no(`Those materials add up to Level ${sum}, but ${n} is Level ${d.level}. They have to match exactly.`); }
  endSelect();
  mats.forEach(m=>place(m,"gy"));
  const want=P.synZone; P.synZone=null;
  const z = want && !occ(want) ? want : !EMZ.some(occ) ? "emzL" : freeMZ();
  if(!z) return no("You have no open zone for that monster.");
  place(u,z,{pos:"atk",placedTurn:P.turn,proper:true});
  say(`Synchro Summoned ${n} using ${mats.map(m=>P.cards[m].n).join(", ")}.`);
  renderPlay(); setTimeout(()=>fx(z,"Synchro Summon"),350);
}

// ---- Spells & Traps ----
function resolveLater(u){
  const c=P.cards[u], st=subType(c.n)||"Normal";
  if(["Normal","Quick-Play","Ritual","Counter"].includes(st)) setTimeout(()=>{ if(isZone(P.cards[u].where)){ restoring=true; place(u,"gy"); renderPlay(); restoring=false; lastState=ser(); } },1200);
  return st;
}
function stCost(u){ const e=effectsOf(P.cards[u].n).find(e=>!e.locs); if(e&&e.cost) owe(u,e); }
function tryActivate(u,zone){
  const c=P.cards[u], st=subType(c.n)||"Normal";
  if(KIND[c.n]==="trap") return no("Traps have to be Set first. You can activate it starting on your next turn.");
  if(st==="Field"){
    if(zone && zone!=="field") return no("Field Spells go in the Field Zone.");
  } else {
    if(zone==="field") return no("Only Field Spells go in the Field Zone.");
    if(zone && occ(zone)) return no("That zone already has a card in it.");
    if(!zone && !freeSZ()) return no("All 5 of your Spell & Trap Zones are full.");
  }
  optCheck(c.n,()=>{
    if(st==="Field"){ const old=occ("field"); if(old) place(old,"gy"); place(u,"field",{pos:"up",placedTurn:P.turn}); }
    else place(u,zone||freeSZ(),{pos:"up",placedTurn:P.turn});
    resolveLater(u); stCost(u);
    const gt=grantFrom(c.n);
    say(`Activated ${c.n}. Apply its effect by moving the cards yourself.${["Normal","Quick-Play","Ritual"].includes(st)?" It goes to the GY once it resolves.":""}${gt}`);
    renderPlay();
  });
}
function trySet(u,zone){
  const c=P.cards[u], st=subType(c.n);
  if(st==="Field"){ if(zone && zone!=="field") return no("Field Spells go in the Field Zone.");
    const old=occ("field"); if(old) place(old,"gy"); place(u,"field",{pos:"set",placedTurn:P.turn}); }
  else {
    if(zone==="field") return no("Only Field Spells go in the Field Zone.");
    if(zone && occ(zone)) return no("That zone already has a card in it.");
    const z=zone||freeSZ(); if(!z) return no("All 5 of your Spell & Trap Zones are full.");
    place(u,z,{pos:"set",placedTurn:P.turn});
  }
  say(`Set ${c.n} face-down.${KIND[c.n]==="trap"?" You can activate it starting next turn.":""}`); renderPlay();
}
function activateSet(u){
  const c=P.cards[u], st=subType(c.n)||"Normal", trap=KIND[c.n]==="trap";
  if(trap && c.placedTurn===P.turn) return no("You can’t activate a Trap the same turn you Set it.");
  if(!trap && st==="Quick-Play" && c.placedTurn===P.turn) return no("You can’t activate a Quick-Play Spell the same turn you Set it.");
  optCheck(c.n,()=>{ c.pos="up"; resolveLater(u); stCost(u); const gt=grantFrom(c.n); say(`Activated ${c.n}. Apply its effect by moving the cards yourself.${gt}`); renderPlay(); });
}

// ---- Effects and other actions ----
function useEffect(u,pick){
  const c=P.cards[u], d=info(c.n), src=locOf(c.where);
  const effs=effectsHere(u);
  if(!effs.length && (src==="hand"||src==="gy") && effectsOf(c.n).some(e=>e.selfSS&&e.locs.includes(src)))
    return no(`${c.n} Special Summons itself from your ${src==="gy"?"GY":"hand"}. Set “Play cards as” to Special, then drag it onto the field.`);
  let e=pick;
  if(!e && effs.length>1){
    const short=t=>{ const x=t.replace(/^[^:]*:\s*/,""); return x.length>70? x.slice(0,68)+"…" : x; };
    return sheet(c.n,u,"Which effect are you using?",effs.map(x=>[short(x.text),()=>useEffect(u,x)]));
  }
  e=e||effs[0]||null;
  optCheck(c.n,()=>{
    let extra="";
    const m=(e||d) && /cannot Special Summon monsters from the Extra Deck for the rest of this turn, except ([^.,]+?) monsters/i.exec(e? e.text : d.desc);
    if(m && isZone(c.where)){ P.lock={src:c.n,text:m[1].trim(),words:m[1].trim().split(/\s+/)}; extra=` From now on this turn you can only Special Summon ${P.lock.text} monsters from the Extra Deck.`; }
    const el=pEls[u]; if(isZone(c.where)||c.where==="hand"){ el.classList.add("act"); setTimeout(()=>el.classList.remove("act"),1500); }
    const from={hand:" from your hand",gy:" from the GY",ban:" while banished"}[c.where]||"";
    if(e && e.cost) owe(u,e);
    const gt=grantFrom(c.n,e?e.text:null);
    say(`Used ${c.n}’s effect${from}. Move the cards it affects yourself.${extra}${gt}`); renderPlay();
  });
}
function changePos(u){
  if(P.owed||P.lvOwed) return no(OWE_MSG);
  const c=P.cards[u];
  if(c.placedTurn===P.turn) return no("You can’t change a monster’s battle position the turn it was Summoned or Set.");
  if(c.posTurn===P.turn) return no("You can only change a monster’s battle position once per turn.");
  if(c.pos==="set"){ c.pos="atk"; c.posTurn=P.turn; say(`Flip Summoned ${c.n}.`); }
  else { c.pos = c.pos==="atk"?"def":"atk"; c.posTurn=P.turn; say(`${c.n} is now in ${c.pos==="atk"?"Attack":"Defense"} Position.`); }
  renderPlay();
}
function moveTo(u,where,msg){
  const c=P.cards[u];
  if(where==="hand" && KIND[c.n]==="extra") msg=`${c.n} went back to the Extra Deck, since Extra Deck monsters can’t go to the hand.`;
  if(where==="deck" && KIND[c.n]==="extra") msg=`${c.n} went back to the Extra Deck.`;
  place(u,where); say(msg); renderPlay();
}

let dropMode="normal";
document.querySelectorAll("#dmode button").forEach(b=>b.onclick=()=>setDropMode(b.dataset.m));
function setDropMode(m){ dropMode=m; document.querySelectorAll("#dmode button").forEach(b=>b.classList.toggle("on",b.dataset.m===m)); }
const FROM={hand:"from your hand",gy:"from your GY",deck:"from your Deck",extra:"from your Extra Deck",ban:"from banishment"};
function dropAt(u,x,y,ban){
  const c0=P.cards[u];
  const k0=ban?"ban":zoneAt(x,y), inHand0=!ban && y>G.boardH;
  if(P.lvOwed){ if(!inHand0 && !k0) return; if(k0===c0.where || (inHand0 && c0.where==="hand")) return; no(OWE_MSG); return lvSheet(); }
  if(P.owed){
    const dest= k0==="ban"?"ban" : k0==="gy"?"gy" : null;
    if(dest && pays(u,dest)) return payOwed(u,dest);
    if(!inHand0 && !k0) return;
    if(k0===c0.where || (inHand0 && c0.where==="hand")) return;
    return no(dest===P.owed.to && P.owed.from.includes(locOf(c0.where)) ? "That card can’t be used for this." : OWE_MSG);
  }
  if(c0.where==="deck"){
    const dest= inHand0?"hand" : k0==="gy"?"gy" : k0==="ban"?"ban" : (k0 && isZone(k0))?"field" : null;
    if(dest){ const r=deckCheck(u,dest); if(r.err) return no(r.err);
      const res=dropInner(u,x,y,ban);
      if(P.cards[u].where!=="deck"){ useGrant(r.g);
        if(r.g.src==="Bone Archfiend" && dest==="gy"){ P.lvOwed={src:"Bone Archfiend",sent:P.cards[u].n}; renderPlay(); setTimeout(lvSheet,350); }
        else renderPlay(); }
      return res; }
  }
  if(c0.where==="gy"){
    if(inHand0){ const r=permCheck(u,"gy","hand"); if(r.err) return no(r.err);
      const res=dropInner(u,x,y,ban); if(P.cards[u].where!=="gy"){ useGrant(r.g); renderPlay(); } return res; }
    if(k0 && isZone(k0) && !isMonKind(c0.n)){ const r=permCheck(u,"gy","field"); if(r.err) return no(r.err);
      const res=dropInner(u,x,y,ban); if(P.cards[u].where!=="gy"){ useGrant(r.g); renderPlay(); } return res; }
  }
  return dropInner(u,x,y,ban);
}
function dropInner(u,x,y,ban){
  if(P.owed||P.lvOwed) return no(OWE_MSG);
  const c=P.cards[u], n=c.n, w=c.where, ex=KIND[n]==="extra", mon=isMonKind(n);
  const k=ban?"ban":zoneAt(x,y), inHand=!ban && y>G.boardH, from=isZone(w)?"":" "+(FROM[w]||"");
  if(inHand){
    if(w==="hand") return;
    if(ex) return no(`${n} is an Extra Deck monster, so it can’t go to your hand.`);
    return moveTo(u,"hand", w==="deck"?`Added ${n} from your Deck to your hand.`:`Returned ${n} to your hand${from}.`);
  }
  if(!k || k===w) return;
  if(k.startsWith("o")) return no("That’s your opponent’s side of the field.");
  if(k==="ban") return moveTo(u,"ban",`Banished ${n}${from}.`);
  if(k==="gy") return moveTo(u,"gy", w==="hand"?`Sent ${n} from your hand to the GY.`:`Sent ${n}${from} to the GY.`);
  if(k==="deck"){ if(ex) return no("Extra Deck monsters go back to the Extra Deck, not your main Deck."); if(w==="deck") return; return moveTo(u,"deck",`Shuffled ${n} into your Deck.`); }
  if(k==="extra"){ if(!ex) return no("Only Synchro monsters go in the Extra Deck."); return moveTo(u,"extra",`Returned ${n} to your Extra Deck.`); }
  if(isZone(w)) return no("You can’t move a card to a different zone without a card effect that lets you.");
  if(mon){
    if(SZ.includes(k)||k==="field") return no("Monsters go in your Monster Zones, the row above your Spell & Trap Zones.");
    if(w==="extra") return startSynchro(u,k);
    if(w==="hand" && (dropMode==="normal"||dropMode==="set")){
      const ok=tryNormal(u,k,dropMode==="set");
      if(P.normalUsed && P.cards[u].where!=="hand") setDropMode("spa");
      return ok;
    }
    return trySpecial(u,k,dropMode==="spd"?"def":"atk");
  }
  if(isMonZone(k)) return no("Spells and Traps go in your Spell & Trap Zones, the bottom row.");
  if(KIND[n]==="trap"){ if(k==="field") return no("Only Field Spells go in the Field Zone."); return trySet(u,k); }
  if(k==="field" && subType(n) && subType(n)!=="Field") return no("Only Field Spells go in the Field Zone.");
  if(SZ.includes(k) && subType(n)==="Field") return no("Field Spells go in the Field Zone, on the left.");
  return dropMode==="set"? trySet(u,k) : tryActivate(u,k);
}

// ---- Menus ----
function lvSheet(){
  const o=P.lvOwed; if(!o) return;
  const mons=Object.keys(P.cards).filter(u=>{ const c=P.cards[u]; return isMonZone(c.where) && c.pos!=="set" && lvl(u)!=null; });
  const d=DB[o.src]||{}, box=document.getElementById("mbox"); box.className="sheet";
  box.innerHTML=`<div class="hd">${d.small?`<img src="${d.small}" alt="">`:""}<div><h3>${esc(o.src)}</h3><p>${esc(o.sent)} went to the GY, so now increase or decrease the Level of a face-up monster you control by 1.</p></div></div>`;
  const add=(label,fn,cls)=>{ const b=document.createElement("button"); b.textContent=label; if(cls) b.className=cls; b.onclick=fn; box.appendChild(b); };
  const done=(u,k)=>{ const c=P.cards[u]; c.lvMod=(c.lvMod||0)+k; P.lvOwed=null; closeCard(); renderPlay(); say(`${c.n} is now Level ${lvl(u)}. You can carry on.`); };
  mons.forEach(u=>{ const c=P.cards[u], L=lvl(u);
    if(L>1) add(`${c.n}: Level ${L} → ${L-1}`,()=>done(u,-1));
    add(`${c.n}: Level ${L} → ${L+1}`,()=>done(u,1)); });
  if(!mons.length){ P.lvOwed=null; say("You have no face-up monster with a Level, so there’s nothing to change."); renderPlay(); return; }
  add("↶ Undo sending the card",()=>{ closeCard(); undo(); },"cancel");
  modal.classList.add("on");
}
function sheet(n,u,msg,acts){
  const d=DB[n]||{}, box=document.getElementById("mbox"); box.className="sheet";
  box.innerHTML=`<div class="hd">${d.small?`<img src="${d.small}" alt="">`:""}<div><h3>${esc(n)}</h3>${msg?`<p>${esc(msg)}</p>`:""}</div></div>`;
  const add=(label,fn,cls)=>{ const b=document.createElement("button"); b.textContent=label; if(cls) b.className=cls; b.onclick=()=>{ closeCard(); fn(); }; box.appendChild(b); };
  acts.forEach(([l,f])=>add(l,f));
  add("Card details",()=>openCard(n));
  add("Cancel",()=>{},"cancel");
  modal.classList.add("on");
}
function pileGesture(el,u){
  el.addEventListener("pointerdown",e=>{
    e.preventDefault(); const sx=e.clientX, sy=e.clientY; let moved=false, long=false;
    const lp=setTimeout(()=>{ if(!moved){ long=true; if(navigator.vibrate) navigator.vibrate(20); closeCard(); holdCard(u); } },500);
    const mv=ev=>{ if(long) return;
      if(!moved && Math.hypot(ev.clientX-sx,ev.clientY-sy)<8) return;
      if(!moved){ moved=true; clearTimeout(lp); closeCard(); startPileDrag(u); }
      pileDragMove(u,ev); };
    const up=ev=>{ clearTimeout(lp); window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); window.removeEventListener("pointercancel",cx);
      if(long) return;
      if(moved){ const r=stage.getBoundingClientRect(); pEls[u].style.transition=""; pEls[u].style.pointerEvents="";
        dropAt(u,ev.clientX-r.left,ev.clientY-r.top,overBan(ev)); renderPlay(); return; }
      openCard(P.cards[u].n,u); };
    const cx=()=>{ clearTimeout(lp); window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); window.removeEventListener("pointercancel",cx); renderPlay(); };
    window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up); window.addEventListener("pointercancel",cx);
  });
}
function startPileDrag(u){
  const el=pEls[u]; el.style.display=""; el.style.width=G.cw+"px"; el.style.height=G.ch+"px";
  el.style.transition="none"; el.style.zIndex=300; el.style.pointerEvents="none"; el.classList.remove("down");
}
function pileDragMove(u,e){ const r=stage.getBoundingClientRect(), el=pEls[u];
  el.style.transform=`translate(${e.clientX-r.left-G.cw/2}px,${e.clientY-r.top-G.ch/2}px) scale(1.3)`; }
function openPlayPile(k){
  if(P.sel) return no("Finish picking cards first, or tap Cancel.");
  let list=Object.keys(P.cards).filter(u=>P.cards[u].where===k);
  if(k==="gy"||k==="ban") list.sort((a,b)=>P.cards[b].t-P.cards[a].t); else list.sort((a,b)=>P.cards[a].n.localeCompare(P.cards[b].n));
  const groups=[]; const seen={};
  list.forEach(u=>{ const n=P.cards[u].n; if(seen[n]) seen[n].q++; else { seen[n]={u,n,q:1}; groups.push(seen[n]); } });
  const box=document.getElementById("mbox"); box.className="pview";
  const title={gy:"Graveyard",deck:"Deck",extra:"Extra Deck",ban:"Banished"}[k];
  box.innerHTML=`<h3>${title} (${list.length})</h3>` + (list.length? `<div class="pg">`+groups.map(g=>{ const d=DB[g.n]||{};
    return `<div class="pc" data-u="${g.u}">${d.small?`<img src="${d.small}" alt="">`:esc(g.n)}${g.q>1?`<span class="q">×${g.q}</span>`:""}</div>`; }).join("")+`</div>`
    : `<div class="empty">No cards here.</div>`) + `<p class="empty" style="margin:0;font-size:13px">Tap a card for details. Drag it out onto the field or your hand.${k==="gy"||k==="ban"?" Hold it to use its effect from here.":""}</p><button id="mClose">Close</button>`;
  box.querySelectorAll(".pc").forEach(e=>pileGesture(e,e.dataset.u));
  document.getElementById("mClose").onclick=closeCard;
  modal.classList.add("on");
}

document.getElementById("pNext").onclick=()=>{
  if(P.sel) return no("Finish picking cards first, or tap Cancel.");
  if(P.owed||P.lvOwed) return no(OWE_MSG);
