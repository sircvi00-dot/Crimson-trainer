      hint:"Synkron Resonator is Level 1 and Bone Archfiend is Level 4. You need one more Level to reach 6.",
      cap:`Bone Archfiend sends ${sn} from your ${ft[1]==="hand"?"hand":"Deck"} to the GY and raises Synkron Resonator’s Level by 1. Your two monsters now add up to Level 6.`,ops:[[sent,"gy"]],act:[r.bone]});
    C.skipSynkron=true;
    const id=doSynchro(C,"Red Rising Dragon",[t,r.bone]," Don’t use Synkron Resonator’s effect yet. It would take Crimson Resonator out of your GY, and you want to revive it next.");
    return !!id;
  }
  return !!doSynchro(C,"Red Rising Dragon",[t,r.bone]);
}

// ---- Turns with no starter ----
const SET_PREF=["Wandering King Wildwind","Red Lotus King, Flame Crime","Creation Resonator","Red Resonator","Synkron Resonator","Vision Resonator","Crimson Resonator","Soul Resonator","Bone Archfiend"];
function setTraps(C,cap){
  const traps=cHand(C).filter(id=>KIND[C.inst[id]]==="trap"), ops=[];
  traps.forEach(id=>{ const z=SZP.find(z=>cFree(C,z)&&!ops.some(o=>o[1]===z)); if(z) ops.push([id,z,"down"]); });
  if(!ops.length) return 0;
  const names=ops.map(o=>C.inst[o[0]]);
  S(C,{q:`Set ${listNames([...new Set(names)])}`,w:["Discard them","Keep them in your hand"],hint:"Set your traps so they’re ready for your opponent’s turn.",
    cap: cap? cap.replace("{t}",listNames(names)) : `Set ${listNames(names)} so they’re ready for your opponent’s turn.`,ops});
  return ops.length;
}
function brickPlays(C){
  setTraps(C, C.turn===1? "Set {t}. With no combo this turn, your traps are your defense." : "Set {t}. Your traps are still your best defense while you wait for a starter.");
  if(C.ns) return;
  const hasSetMon=cMons(C).some(id=>C.face[id]==="down");
  const m=SET_PREF.map(n=>cAt(C,"hand",n)).find(id=>id && LV(C.inst[id])!=null && LV(C.inst[id])<=4);
  const z=fM(C);
  if(m && z){ const n=C.inst[m];
    const keep = n==="Bone Archfiend"? " Bone Archfiend can even Special Summon itself back from the GY later if it gets destroyed." : TUN(n)? " It’s a Tuner you might want later, but nothing else in your hand can block." : "";
    S(C,{q:`Set ${n}`,w:["Normal Summon it in Attack Position","Keep every monster in hand"],
      hint:"A face-down Defense monster can block an attack without risking your Life Points.",
      cap:`Set ${n} face-down in Defense Position${hasSetMon?" as a second blocker":" so it can block an attack"}. This uses your Normal Summon.${keep}`,ops:[[m,z,"down"]],act:[m],chk:{ns:1}});
    C.ns=true; }
}
function holdPlays(C){
  setTraps(C,"Set {t}. Your board is still standing, so add the new trap to your defense.");
  const st=cHand(C).find(id=>STARTERS.includes(C.inst[id]));
  if(st) C.note=` Keep ${C.inst[st]} in your hand. If your board gets broken, it starts your combo again.`;
}
function battle(C){
  const att=cUp(C).filter(id=>KIND[C.inst[id]]==="extra");
  if(!att.length) return;
  const names=att.map(id=>C.inst[id]);
  S(C,{q:`Attack with ${names.length>1?"your Synchro Monsters":names[0]}`,w:["Skip your Battle Phase","Attack with your small Tuners first"],
    hint:"Your opponent took their turn, so now you can attack. Your Synchro Monsters hit hardest.",
    cap:`Battle Phase: attack with ${listNames(names)}. Clear their monsters first, then hit their Life Points.${names.includes("Red Dragon Archfiend")?" Red Dragon Archfiend destroys your other monsters that didn’t attack at the end of your turn, so attack with everything you can.":""}`,ops:[]});
}

// ---- One whole turn ----
function mainPhase(C){
  C.note="";
  const big=cUp(C).filter(id=>KIND[C.inst[id]]==="extra");
  if(C.turn>1 && big.length){ holdPlays(C); battle(C); return "hold"; }
  const r=planRoute(C);
  if(r){ const ok = r.kind==="bone"? runBone(C,r) : runSoul(C,r);
    if(ok) synchroChain(C);
    setTraps(C);
    if(C.turn>1) battle(C);
    return r.kind; }
  brickPlays(C);
  if(C.turn>1) battle(C);
  return "brick";
}
function boardText(C){
  const big=cUp(C).filter(id=>KIND[C.inst[id]]==="extra").map(id=>C.inst[id]);
  const sets=cIds(C,(w,id)=>SZ.includes(w)&&C.face[id]==="down").map(id=>C.inst[id]);
  const setMon=cMons(C).filter(id=>C.face[id]==="down").map(id=>C.inst[id]);
  const parts=[];
  if(big.includes("Red Nova Dragon")) parts.push("Red Nova Dragon as your boss");
  if(big.includes("Hot Red Dragon Archfiend Abyss")) parts.push("Abyss to negate a card");
  big.filter(n=>n!=="Red Nova Dragon"&&n!=="Hot Red Dragon Archfiend Abyss").forEach(n=>parts.push(n));
  if(sets.includes("Red Zone")) parts.push("Red Zone to destroy a card");
  const other=sets.length-(sets.includes("Red Zone")?1:0);
  if(other) parts.push(`${other}${sets.includes("Red Zone")?" more":""} Set trap${other>1?"s":""}`);
  if(setMon.length) parts.push(`a face-down ${setMon.join(" and a face-down ")} to block`);
  if(cAt(C,"gy","Soul Resonator") && big.some(RDA_FAM)) parts.push("Soul Resonator in the GY to protect your cards");
  return parts.length? listNames(parts) : "nothing on the field";
}
function endTurn(C,kind){
  const hand=cHand(C);
  if(hand.length>6){ const extra=hand.sort((a,b)=>PRI.indexOf(C.inst[a])-PRI.indexOf(C.inst[b])).slice(0,hand.length-6);
    S(C,{q:"Discard down to 6 cards",w:["End your turn with 7 cards","Discard your best card"],hint:"You can only end your turn with 6 cards in hand.",
      cap:`You have ${hand.length} cards, so discard ${listNames(extra.map(id=>C.inst[id]))} before ending your turn.`,ops:extra.map(id=>[id,"gy"])}); }
  const left=cHand(C).map(id=>C.inst[id]), dz=deckSize(C);
  const st=STARTERS.reduce((a,n)=>a+(C.left[n]||0),0);
  const odds = dz? ` Your Deck has ${dz} card${dz>1?"s":""} left and ${st} of them ${st===1?"is a starter":"are starters"} (Soul Resonator, Resonator Call, or Crimson Gaia), so your next draw has about a ${Math.round(100*st/dz)}% chance of being one.` : "";
  let cap;
  if(kind==="brick") cap=`End your turn. Your board: ${boardText(C)}. Next turn, you’re hoping to draw Soul Resonator, Resonator Call, or Crimson Gaia${cAt(C,"hand","Bone Archfiend")||cAt(C,"gy","Bone Archfiend")?", or a Level 1 or 2 Resonator to go with Bone Archfiend":""}.${odds}`;
  else cap=`End ${C.turn===1?"board":"your turn. Your board"}: ${boardText(C)}.`+(left.length?` You still have ${listNames(left)} in hand for later.`:"")+(C.note||"");
  if(cUp(C).some(id=>C.inst[id]==="Red Dragon Archfiend") && C.turn===1) cap+=" Red Dragon Archfiend will destroy your other monsters at the end of your turn, since nobody attacked.";
  S(C,{q:"End your turn",w:["Attack","Activate a Spell you can’t use yet"],hint: C.turn===1?"The player going first can’t attack on turn 1.":"Once you’ve attacked and Set your cards, end your turn.",cap,ops:[]});
  if(cUp(C).some(id=>C.inst[id]==="Red Dragon Archfiend") && C.turn===1){
    const others=cUp(C).filter(id=>C.inst[id]!=="Red Dragon Archfiend").concat(cMons(C).filter(id=>C.face[id]==="down"));
    if(others.length) C.steps[C.steps.length-1].ops=others.map(id=>[id,"gy"]), others.forEach(id=>C.loc[id]="gy");
  }
}
const OPEN_TXT={soul:"You have Soul Resonator, your starter, so you can go straight into the main combo.",
  call:"No Soul Resonator, but Resonator Call can search it, so this hand still reaches the full combo.",
  gaia:"No Soul Resonator, but Crimson Gaia can search it, so this hand still reaches the full combo.",
  bone:"No Soul Resonator, Resonator Call, or Crimson Gaia, but Bone Archfiend plus a small Tuner can still make Red Rising Dragon and start the combo.",
  brick:"There’s no Soul Resonator, Resonator Call, or Crimson Gaia here, and no Bone Archfiend with a small Tuner, so this hand can’t start the main combo. You’ll build a defense instead."};
function newLine(handNames){
  const C={inst:{},init:{},steps:[],k:0,loc:{},face:{},mod:{},turn:1,ns:false,used:new Set(),lock:[],left:{},note:""};
  ["Monsters","Spells","Traps"].forEach(s=>DECK[s].forEach(([q,n])=>C.left[n]=(C.left[n]||0)+q));
  handNames.forEach(n=>{ C.left[n]--; cAdd(C,n,"hand"); });
  DECK["Extra Deck"].forEach(([q,n])=>{ for(let i=0;i<q;i++) cAdd(C,n,"extra"); });
  const r=planRoute(C);
  S(C,{cap:`Your opening hand: ${listNames(handNames)}. ${OPEN_TXT[r?r.kind:"brick"]}`,ops:[]});
  C.lastKind=mainPhase(C); endTurn(C, C.lastKind);
  return C;
}

// ---- Your opponent's turn, then your next turn ----
function pickW(list){ let t=list.reduce((a,x)=>a+x[1],0), r=Math.random()*t; for(const x of list){ if((r-=x[1])<=0) return x[0]; } return list[0][0]; }
function opponentTurn(C,force){
  const mons=cMons(C), up=cUp(C), big=up.filter(id=>KIND[C.inst[id]]==="extra");
  const sets=cIds(C,(w,id)=>SZ.includes(w)&&C.face[id]==="down"), setMon=mons.filter(id=>C.face[id]==="down");
  const soul=cAt(C,"gy","Soul Resonator"), guard=soul && big.some(id=>RDA_FAM(C.inst[id]));
  const opts=[];
  if(big.length){ opts.push(["held",3],["wiped",3]); if(sets.length) opts.push(["backrow",2]); }
  else { opts.push(["quiet",2]); if(setMon.length) opts.push(["attacked",3]); if(sets.length) opts.push(["backrow",2]); }
  const sc=force&&opts.some(o=>o[0]===force)? force : pickW(opts);
  C.scenario=sc;
  const T=`Your opponent’s turn. `;
  let cap, ops=[];
  if(sc==="held"){
    const why=[]; if(big.some(id=>C.inst[id]==="Hot Red Dragon Archfiend Abyss")) why.push("Abyss negated their best card");
    const rz=sets.find(id=>C.inst[id]==="Red Zone"); if(rz){ why.push("Red Zone destroyed another"); ops.push([rz,C.loc[rz],"up"]); }
    cap=T+(why.length? `${why.join(" and ")}, so they couldn’t get through. Your board is still standing.` : "They couldn’t get past your monsters, so your board is still standing.");
  } else if(sc==="wiped"){
    ops=mons.map(id=>[id,"gy"]);
    cap=T+`They got through and destroyed all your monsters in battle.${soul?" Soul Resonator in your GY only protects against card effects, so it couldn’t stop that.":""} Your Set cards are still there. Now you rebuild.`;
  } else if(sc==="backrow"){
    if(guard){ ops=[[soul,"ban"]];
      cap=T+"They used an effect to destroy your Set cards, so you banished Soul Resonator from your GY to protect them. That’s what it’s there for. Everything is still standing."; }
    else { ops=sets.map(id=>[id,"gy"]);
      cap=T+`They destroyed your Set ${sets.length>1?"cards":"card"} with an effect before you could use ${sets.length>1?"them":"it"}.${setMon.length||big.length?" Your monsters are still there.":""}`; }
  } else if(sc==="attacked"){
    ops=setMon.map(id=>[id,"gy"]);
    cap=T+`They attacked your face-down ${listNames(setMon.map(id=>C.inst[id]))} and destroyed it. Your Life Points are safe, which is why you Set it.`;
  } else cap=T+"They Set a few cards and ended their turn without attacking you.";
  S(C,{auto:true,opp:true,cap,ops});
}
function drawCard(C){
  const pool=[]; for(const n in C.left) for(let i=0;i<C.left[n];i++) pool.push(n);
  if(!pool.length) return null;
  const n=pool[Math.floor(Math.random()*pool.length)], id=deckTake(C,n);
  return id;
}
function advanceTurn(C,force){
  if(!deckSize(C)) return false;
  opponentTurn(C,force);
  C.turn++; C.ns=false; C.used=new Set(); C.lock=[]; C.mod={};
  const id=drawCard(C), n=C.inst[id];
  S(C,{auto:true,cap:"",ops:[[id,"hand"]]}); const drawStep=C.steps[C.steps.length-1];
  const r=planRoute(C);
  const big=cUp(C).some(x=>KIND[C.inst[x]]==="extra");
  const st=STARTERS.includes(n);
  let say;
  if(big) say = st? ` It’s a starter, but your board survived, so you won’t need it this turn.` : ` Your board is still standing, so this turn is about attacking.`;
  else if(r) say = st? ` That’s a starter, so you can run the combo this turn.` : r.kind==="bone"? ` With Bone Archfiend and a small Tuner, you can start the combo this turn.` : ` Your hand already had what you need, so you can run the combo now.`;
  else say = C.lastKind==="brick" ? ` Still no starter, so this is another defensive turn. Here’s the best backup play with what you have.` : ` Nothing in your hand can restart the combo, so this is a defensive turn. Here’s the best backup play with what you have.`;
  drawStep.cap=`Turn ${C.turn}, your draw. You draw ${n}.${say}`;
  C.lastKind=mainPhase(C); endTurn(C, C.lastKind);
  return true;
}

function loadLine(L,start=0,keep=false){
  if(!keep) qReset();
  stop();
  for(const id in cardEls){ cardEls[id].remove(); delete cardEls[id]; }
  for(const k in INST) delete INST[k]; for(const k in INIT) delete INIT[k];
  Object.assign(INST,L.inst); Object.assign(INIT,L.init);
  STEPS.length=0; L.steps.forEach(s=>STEPS.push(s));
  makeCards(); applyImages();
  if(mode==="play") for(const id in cardEls) cardEls[id].style.display="none";
  layout();
  cur=Math.min(start,STEPS.length-1);
  if(mode==="practice"){ if(!keep){ right=0; tries=0; } render(cur,false); document.getElementById("fbk").textContent=""; ask(); }
  else render(cur,false);
  document.getElementById("bOrig").style.display = randomActive ? "" : "none";
}
function randomHand(){
  const main=[]; ["Monsters","Spells","Traps"].forEach(s=>DECK[s].forEach(([q,n])=>{ for(let i=0;i<q;i++) main.push(n); }));
  randomActive=true; lineCtx=newLine(shuffle(main).slice(0,5)); loadLine(lineCtx);
}
function nextTurn(){
  stop();
  const at=STEPS.length-1;
  if(!lineCtx) lineCtx=newLine(ORIG_HAND);
  if(!advanceTurn(lineCtx)) return;
  loadLine(lineCtx,at,true);
  if(mode==="watch") setTimeout(()=>go(at+1),60);
}
document.getElementById("bRand").onclick=randomHand;
document.getElementById("bRand2").onclick=randomHand;
document.getElementById("bTurn").onclick=nextTurn;
document.getElementById("bTurn2").onclick=nextTurn;
document.getElementById("bOrig").onclick=()=>{ randomActive=false; lineCtx=null; loadLine({inst:ORIG.INST,init:ORIG.INIT,steps:ORIG.STEPS}); };

let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(mode==="play"){ layout(); renderPlay(false); } else if(mode!=="deck"){ layout(); render(cur,false); } },120); });

(async function init(){
  layout(); makeCards(); render(0,false);
  await loadDB(); if(mode==="play") renderPlay(false); if(mode==="deck") buildDeck();
  const st=document.getElementById("status"); st.textContent="Loading card pictures…";
  const ok=await preloadImages();
  applyImages(); applyPImages(); if(mode==="play") renderPlay(false); if(mode==="deck") buildDeck();
  st.textContent = ok.some(Boolean) ? "" : "Card pictures couldn’t load on this connection. Everything else still works.";
})();

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
